name: Validate native multi-arch images

on:
  push:
    branches:
      - fix/native-multiarch-images

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/niharikag09/lmnr-app-server-multiarch-validation
            image-name: app-server
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/niharikag09/lmnr-app-server-multiarch-validation
            image-name: app-server
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/niharikag09/lmnr-frontend-multiarch-validation
            image-name: frontend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            build-args: |
              NEXT_PUBLIC_APP_VERSION=multiarch-validation
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/niharikag09/lmnr-frontend-multiarch-validation
            image-name: frontend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build-args: |
              NEXT_PUBLIC_APP_VERSION=multiarch-validation
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image-name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/niharikag09/lmnr-app-server-multiarch-validation
            image-name: app-server
          - image: ghcr.io/niharikag09/lmnr-frontend-multiarch-validation
            image-name: frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image-name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform image
        id: manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ matrix.image }}:${{ github.sha }}" \
            $(printf '${{ matrix.image }}@sha256:%s ' *) \
            --metadata-file /tmp/manifest-metadata.json
          echo "digest=$(jq -r '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Verify multi-platform image
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          image="${{ matrix.image }}@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image"
          platforms=$(docker buildx imagetools inspect "$image" --raw |
            jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64, got: $platforms" >&2
            exit 1
          fi
          echo "Verified platforms: $platforms"
