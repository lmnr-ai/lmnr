# Builds the app-server and frontend images for amd64/arm64 on release, pushes
# them to GHCR by digest, merges them into multi-platform tags and attests the
# result (SLSA build provenance, pushed to the registry).
#
# Supply-chain hardening (LAM-2384):
# - the verify-source job gates every build: it fails unless the commit being
#   built is in this repository, is what the release tag points to, and is
#   already on main;
# - every checkout is pinned to this repository at github.sha, without
#   persisted credentials;
# - third-party actions are pinned to commit SHAs.
#
# The verification step lives inline on purpose: a local composite action
# would be loaded from the checked-out tree, i.e. from the code being verified.

name: Build & publish lmnr images
on:
  release:
    types:
      - published

env:
  REGISTRY_GH: ghcr.io

permissions:
  contents: read

jobs:
  verify-source:
    if: github.repository == 'lmnr-ai/lmnr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          # full history + tags, to check the tag and main below
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          origin="$(git remote get-url origin)"
          [ "${origin%.git}" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ] \
            || fail "origin remote is not $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          [ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" ] \
            || fail "GITHUB_REF $GITHUB_REF is not the release tag $RELEASE_TAG"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] \
            || fail "HEAD $(git rev-parse HEAD) is not GITHUB_SHA $GITHUB_SHA"
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [ "$tag_sha" = "$GITHUB_SHA" ] \
            || fail "tag $RELEASE_TAG points to $tag_sha, not GITHUB_SHA $GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "$GITHUB_SHA is not on main"

          echo "Building $GITHUB_REPOSITORY@$GITHUB_SHA ($RELEASE_TAG)"

  build:
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            build-args: |
              NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build-args: |
              NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image-name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
          - image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download amd64 image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image-name }}-amd64
          path: /tmp/digests

      - name: Download arm64 image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image-name }}-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Create multi-platform image
        id: manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKER_METADATA_OUTPUT_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          tag_args=()
          annotation_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args+=("-t" "$tag")
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          while IFS= read -r annotation; do
            [ -z "$annotation" ] && continue
            annotation_args+=("--annotation" "$annotation")
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"

          source_args=()
          for digest in *; do
            source_args+=("${{ matrix.image }}@sha256:$digest")
          done
          if [ "${#source_args[@]}" -ne 2 ]; then
            echo "Expected 2 image digests, got: ${#source_args[@]}" >&2
            exit 1
          fi

          dry_run_manifest=$(docker buildx imagetools create \
            "${annotation_args[@]}" \
            --dry-run \
            "${source_args[@]}")
          platforms=$(jq -r \
            '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")' \
            <<< "$dry_run_manifest")
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64, got: $platforms" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${annotation_args[@]}" \
            "${source_args[@]}" \
            --metadata-file /tmp/manifest-metadata.json
          echo "digest=$(jq -r '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Verify multi-platform image
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          image="${{ matrix.image }}@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image"
          platforms=$(docker buildx imagetools inspect "$image" --raw |
            jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64, got: $platforms" >&2
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
