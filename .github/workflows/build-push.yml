name: Build & publish lmnr images
on:
  push:
    branches:
      - chore/test/fix/native-multiarch-images

env:
  REGISTRY_GH: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - dockerfile: ./app-server/Dockerfile
            context: ./app-server
            image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            build-args: |
              NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
          - dockerfile: ./frontend/Dockerfile
            context: ./frontend
            image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build-args: |
              NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
              NEXT_DEPLOYMENT_ID=${{ github.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image-name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/lmnr-ai/app-server
            image-name: app-server
          - image: ghcr.io/lmnr-ai/frontend
            image-name: frontend
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download amd64 image digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.image-name }}-amd64
          path: /tmp/digests

      - name: Download arm64 image digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.image-name }}-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Create multi-platform image
        id: manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_TAGS: "0.2.3-alpha.1,alpha"
        run: |
          tag_args=()
          annotation_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args+=("-t" "$tag")
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          while IFS= read -r annotation; do
            [ -z "$annotation" ] && continue
            annotation_args+=("--annotation" "$annotation")
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"

          source_args=()
          for digest in *; do
            source_args+=("${{ matrix.image }}@sha256:$digest")
          done
          if [ "${#source_args[@]}" -ne 2 ]; then
            echo "Expected 2 image digests, got: ${#source_args[@]}" >&2
            exit 1
          fi

          dry_run_manifest=$(docker buildx imagetools create \
            "${annotation_args[@]}" \
            --dry-run \
            "${source_args[@]}")
          platforms=$(jq -r \
            '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")' \
            <<< "$dry_run_manifest")
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64, got: $platforms" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${annotation_args[@]}" \
            "${source_args[@]}" \
            --metadata-file /tmp/manifest-metadata.json
          echo "digest=$(jq -r '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Verify multi-platform image
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          image="${{ matrix.image }}@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image"
          platforms=$(docker buildx imagetools inspect "$image" --raw |
            jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64, got: $platforms" >&2
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: false
