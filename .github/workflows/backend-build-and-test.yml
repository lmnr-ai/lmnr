name: Backend build and test

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
    paths:
      # Explicit list prevents triggering build on changes such as
      # README, .env.example.
      - "app-server/src/**"
      - "app-server/proto/**"
      - "app-server/**/*.rs"
      - "app-server/Cargo.lock"
      - "app-server/Cargo.toml"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1 # immutable tag

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-app-server-pr-${{ hashFiles('app-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-app-server-pr-

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0 # immutable tag
        with:
          context: ./app-server
          push: false
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          target: builder
          tags: app-server-test:latest
          load: true

      - name: Run tests inside container
        run: |
          echo "Running tests inside Docker container..."
          # --release reuses the release artifacts the `builder` stage already
          # compiled (target/release). A debug `cargo test` reads target/debug,
          # which is empty, so it recompiles the whole dependency tree from
          # scratch — the recompile that was blowing past the 30 min timeout.
          docker run --rm -t app-server-test:latest cargo test --release -- --nocapture
